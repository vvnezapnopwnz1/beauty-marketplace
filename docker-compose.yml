services:
  postgres:
    image: postgres:16
    container_name: beauty_db
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
      POSTGRES_DB: beauty
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty -d beauty"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beauty_backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: production
      DATABASE_DSN: postgres://beauty:beauty@postgres:5432/beauty?sslmode=disable
      2GIS_API_KEY: ${TWO_GIS_API_KEY:-}
      2GIS_REGION_ID: ${TWO_GIS_REGION_ID:-32}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Storage configuration
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      # S3/MinIO configuration
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-beauty-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      # Local storage fallback
      FILE_UPLOAD_PATH: /uploads
      FILE_PUBLIC_BASE_URL: ${FILE_PUBLIC_BASE_URL:-http://localhost:8080/uploads}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/uploads

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
    container_name: beauty_bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgres://beauty:beauty@postgres:5432/beauty?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

  # MinIO S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: beauty_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: beauty_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set minio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb minio/${S3_BUCKET:-beauty-uploads} --ignore-existing;
      /usr/bin/mc anonymous set download minio/${S3_BUCKET:-beauty-uploads};
      exit 0;
      "

  # UI: http://localhost:5173 — геолокация в браузере требует secure context (HTTPS или localhost).
  # Открытие по http://<LAN-IP>:5173 без HTTPS обычно блокирует GPS; образы/контейнеры тут ни при чём.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beauty_frontend
    depends_on:
      - backend
    environment:
      # Прокси Vite dev (сервер внутри контейнера): /api → backend
      VITE_PROXY_TARGET: http://backend:8080
      # Браузер на хосте ходит на API напрямую (обходит сбои прокси); для доступа с другого ПК в LAN замените на http://<IP-хоста>:8080
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: beauty_openobserve
    environment:
      ZO_ROOT_USER_EMAIL: admin@example.com
      ZO_ROOT_USER_PASSWORD: admin123
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data

  vector:
    image: timberio/vector:0.39.0-alpine
    container_name: beauty_vector
    depends_on:
      - openobserve
      - backend
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./observability/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  openobserve_data:
  uploads_data:
  minio_data: